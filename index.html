<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialética News — Portal de Análise Inteligente</title>
  <meta name="description"
    content="Dashboard administrativo do portal de notícias dialéticas com análise via Gemini AI" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>

<body>
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-text">Dialética<span class="brand-accent">News</span></span>
      </div>
      <ul class="nav-list">
        <li>
          <a href="#/" class="nav-link active" data-view="dashboard" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#/articles" class="nav-link" data-view="articles" id="nav-articles">
            <span class="nav-icon">📰</span>
            <span class="nav-label">Artigos</span>
          </a>
        </li>
        <li>
          <a href="#/editor" class="nav-link" data-view="editor" id="nav-editor">
            <span class="nav-icon">✍️</span>
            <span class="nav-label">Editor</span>
          </a>
        </li>
        <li>
          <a href="#/settings" class="nav-link" data-view="settings" id="nav-settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Configurações</span>
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <div class="status-badge" id="server-status">
          <span class="status-dot"></span>
          <span class="status-text">Conectando...</span>
        </div>
        <a href="#" id="logout-btn" class="nav-link logout-link" title="Sair">
          <span class="nav-icon">🚪</span>
          <span class="nav-label">Sair</span>
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <div id="view-container" class="view-container"></div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
